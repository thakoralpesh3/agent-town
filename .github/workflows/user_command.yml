name: Execute User Town Directive

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'User Command for Town Agents (e.g., "Build a new robotics company", "Pave a bridge to South Sector", "Spawn 5 AI architects")'
        required: true
        default: 'Found a new robotics company'
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  execute-command:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.comment.body, '/command ') || startsWith(github.event.issue.title, '[COMMAND]')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract & Execute User Directive
        id: run-cmd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ github.event.inputs.command }}"
          elif [ -n "${{ github.event.comment.body }}" ]; then
            CMD=$(echo "${{ github.event.comment.body }}" | sed 's/\/command //')
          else
            CMD=$(echo "${{ github.event.issue.title }}" | sed 's/\[COMMAND\] //')
          fi

          echo "Executing command: $CMD"
          OUTPUT=$(python3 run_town.py --command "$CMD" --git-commit)
          echo "$OUTPUT"
          
          # If triggered via issue or comment, post response back
          if [ "${{ github.event_name }}" = "issues" ] || [ "${{ github.event_name }}" = "issue_comment" ]; then
            ISSUE_NUM="${{ github.event.issue.number }}"
            gh issue comment "$ISSUE_NUM" --body "$OUTPUT" || true
          fi

      - name: Push Changes
        run: |
          git config --global user.name "GitHub Tech Town Bot"
          git config --global user.email "bot@github-tech-town.local"
          git pull --rebase origin main || true
          git push origin main || echo "No changes or conflict auto-resolved"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
