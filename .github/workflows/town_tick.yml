name: GitHub Tech Town 24/7 Life Cycle

on:
  schedule:
    # Run offset from top of hour (e.g. at minutes 7, 22, 37, 52) to avoid GitHub Actions peak queue delays
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      ticks:
        description: 'Number of simulation ticks to execute'
        required: false
        default: '2'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: town-simulation
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Autonomous Simulation Tick
        run: |
          python3 run_town.py --tick ${{ github.event.inputs.ticks || '2' }} --git-commit

      - name: Push Agent Commits to GitHub
        run: |
          git config --global user.name "GitHub Tech Town Bot"
          git config --global user.email "bot@github-tech-town.local"
          git pull --rebase -X theirs origin main || (git rebase --abort && git pull origin main) || true
          git push origin main || echo "No new commits or conflict safely skipped"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
